: "楼上邻居天天吵，你会？", "a": [{"t": "找物业来调解", "r": "heqin"}, {"t": "上楼带点水果，先好好说", "r": "yahuan"}, {"t": "直接上去敲门，让他们小声点", "r": "biaoshi"}, {"t": "先想个最省事的办法", "r": "shiye"}]}, {"q": "朋友婚礼上，你做什么？", "a": [{"t": "流程怎么走，我来排", "r": "shiye"}, {"t": "礼金、烟酒、开销，我来记", "r": "zhangfang"}, {"t": "两家有意见，我在中间说", "r": "heqin"}, {"t": "现场缺人，我顶上去", "r": "biaoshi"}]}, {"q": "想开一家小店，你先想清什么？", "a": [{"t": "要投多少钱、多久回本", "r": "zhangfang"}, {"t": "卖什么、卖给谁", "r": "shiye"}, {"t": "生意不好怎么办", "r": "biaoshi"}, {"t": "合伙人怎么分钱", "r": "heqin"}]}, {"q": "小组要交一份东西，你做什么？", "a": [{"t": "最后差的那部分我来补", "r": "biaoshi"}, {"t": "有人拖着不交，我去催", "r": "heqin"}, {"t": "定框架，分给谁写哪块", "r": "shiye"}, {"t": "把大家的稿子合成一份、核对数字", "r": "zhangfang"}]}, {"q": "亲戚要给你介绍对象，你？", "a": [{"t": "家里人意见不一，我说清我的想法", "r": "heqin"}, {"t": "见面冷场，我找话说", "r": "biaoshi"}, {"t": "见面吃饭花多少，我算着来", "r": "zhangfang"}, {"t": "先想清楚自己要不要见", "r": "shiye"}]}, {"q": "家里请客，你做什么？", "a": [{"t": "买菜，算着花", "r": "zhangfang"}, {"t": "洗菜切菜、招呼客人", "r": "yahuan"}, {"t": "菜糊了、客人早到了，我救场", "r": "biaoshi"}, {"t": "有人嫌咸有人嫌淡，我圆场", "r": "heqin"}]}, {"q": "一起养猫，你负责什么？", "a": [{"t": "喂食、铲屎、剪指甲", "r": "yahuan"}, {"t": "买粮、记打疫苗的钱", "r": "zhangfang"}, {"t": "谁都不想管了，我去说", "r": "heqin"}, {"t": "半夜生病，我抱去医院", "r": "biaoshi"}]}, {"q": "朋友聚会有人喝多了，你？", "a": [{"t": "我背他下楼", "r": "biaoshi"}, {"t": "有人起哄，我去拦", "r": "heqin"}, {"t": "算好谁送谁、打车多少钱", "r": "zhangfang"}, {"t": "照顾他、送他回家", "r": "yahuan"}]}, {"q": "合租，你管什么？", "a": [{"t": "谁不干活，我去说", "r": "heqin"}, {"t": "东西坏了，我去找人修", "r": "biaoshi"}, {"t": "收拾公共区域、催人扔垃圾", "r": "yahuan"}, {"t": "水电物业费，按月收", "r": "zhangfang"}]}];
var TITLE = "穿越回古代你会是什么身份";
var KICKER = "你穿越回去，被安排成";
var idx = 0, answers = [];
var $ = function (id) { return document.getElementById(id); };
function escapeHtml(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function show(id) {
  var list = document.querySelectorAll("section");
  for (var i = 0; i < list.length; i++) list[i].classList.remove("on");
  $(id).classList.add("on");
  window.scrollTo(0, 0);
}
function render() {
  var q = QUESTIONS[idx];
  $("num").textContent = (idx + 1);
  $("prog").style.width = ((idx + 1) / QUESTIONS.length * 100) + "%";
  $("qtext").textContent = q.q;
  var box = $("opts");
  box.innerHTML = "";
  q.a.forEach(function (o, i) {
    var b = document.createElement("button");
    b.className = "opt";
    var n = document.createElement("span");
    n.className = "optn";
    n.textContent = String(i + 1);
    var t = document.createElement("span");
    t.className = "optt";
    t.textContent = o.t;
    b.appendChild(n);
    b.appendChild(t);
    b.onclick = function () { pick(o.r); };
    box.appendChild(b);
  });
  $("back").style.display = idx === 0 ? "none" : "block";
}
function pick(r) {
  answers[idx] = r;
  if (idx < QUESTIONS.length - 1) { idx++; render(); }
  else { show("loading"); setTimeout(finish, 1000); }
}
function tally() {
  var c = {};
  answers.forEach(function (r) { c[r] = (c[r] || 0) + 1; });
  var best = -1, win = [];
  Object.keys(c).forEach(function (k) {
    if (c[k] > best) { best = c[k]; win = [k]; } else if (c[k] === best) { win.push(k); }
  });
  if (win.length === 1) return win[0];
  var tail = {}, tailBest = -1, tailWin = [];
  answers.slice(-3).forEach(function (r) { tail[r] = (tail[r] || 0) + 1; });
  win.forEach(function (k) {
    var n = tail[k] || 0;
    if (n > tailBest) { tailBest = n; tailWin = [k]; } else if (n === tailBest) { tailWin.push(k); }
  });
  if (tailWin.length === 1) return tailWin[0];
  return answers[answers.length - 1];
}
var REPTITLES = ["身份自画像", "五维性格底色", "你与这个身份的底色", "现实中的你", "盲点与提醒", "你的三句台词"];
var CURRENT = null;
function counts() {
  var c = {};
  answers.forEach(function (r) { c[r] = (c[r] || 0) + 1; });
  return c;
}
function esc(t) { return escapeHtml(t); }
function sec(i, inner) {
  var s = document.createElement("div");
  s.className = "sec";
  var h = document.createElement("h3");
  h.innerHTML = '<i>0' + (i + 1) + ' ·</i>' + esc(REPTITLES[i] || "");
  s.appendChild(h);
  if (inner) {
    var d = document.createElement("div");
    d.innerHTML = inner;
    s.appendChild(d);
  }
  return s;
}
function trioSec(i, raw) {
  var parts = raw.split("\uFF5C"), html = '<div class="grid3">';
  for (var j = 0; j < parts.length; j += 2) {
    html += '<div class="mini"><b>' + esc(parts[j]) + '</b><p>' + esc(parts[j + 1] || "") + '</p></div>';
  }
  html += '</div>';
  return sec(i, html);
}
function twoSec(i, raw) {
  var parts = raw.split("\uFF5C");
  return sec(i, '<span class="rlab">' + esc(parts[0]) + '</span><p>' + esc(parts[1] || "") + '</p>');
}
function quoteSec(i, raw) {
  var parts = raw.split("\uFF5C"), html = '<div class="q3">';
  parts.forEach(function (t) { if (t) html += '<div>' + esc(t) + '</div>'; });
  html += '</div>';
  return sec(i, html);
}
function finish() {
  var key = tally(), r = RESULTS[key];
  CURRENT = r;
  $("rk").innerHTML = r.sc
    ? escapeHtml(KICKER) + ' <span class="sc">' + escapeHtml(r.sc) + ' 分</span>'
    : escapeHtml(KICKER);
  $("rword").textContent = r.w;
  $("rsub").textContent = r.sub;
  $("rcard").textContent = r.card;
  if (r.concl) { $("rconcl").innerHTML = r.concl; }
  var rb = $("rrep");
  rb.innerHTML = "";
  if (r.rep && r.rep.length) {
    $("result").classList.add("has-rep");

    rb.appendChild(sec(0, '<p>' + esc(r.rep[0]) + '</p>'));

    var p2 = (r.rep[1] || "").split("\uFF5C");
    var dims = [];
    p2.slice(1).forEach(function (x) {
      var kv = x.split(":");
      if (kv.length === 2) dims.push({ n: kv[0].trim(), v: parseFloat(kv[1]) || 0 });
    });
    var box = sec(1, '<p>' + esc(p2[0] || "") + '</p>');
    dims.forEach(function (d) {
      var row = document.createElement("div");
      row.className = "dimrow";
      row.innerHTML = '<span class="dn">' + esc(d.n) + '</span>'
        + '<span class="db"><i style="width:' + Math.max(0, Math.min(100, d.v)) + '%"></i></span>'
        + '<span class="dv">' + d.v + '</span>';
      box.appendChild(row);
    });
    if (dims.length) {
      var top = dims.slice().sort(function (a, b) { return b.v - a.v; })[0];
      var lead = document.createElement("p");
      lead.className = "dimlead";
      lead.textContent = "主导维度：" + top.n + " · " + top.v;
      box.appendChild(lead);
    }
    rb.appendChild(box);

    rb.appendChild(trioSec(2, r.rep[2] || ""));
    rb.appendChild(twoSec(3, r.rep[3] || ""));
    rb.appendChild(trioSec(4, r.rep[4] || ""));
    rb.appendChild(quoteSec(5, r.rep[5] || ""));
  }
  $("fig").innerHTML = FIGURES[r.f] || FIGURES.person;
  var box = $("rtags"); box.innerHTML = "";
  r.tags.forEach(function (t) {
    var s = document.createElement("span");
    s.className = "rtag"; s.textContent = "#" + t;
    box.appendChild(s);
  });
  show("result");
}
function toast(msg) {
  var t = $("toast");
  t.textContent = msg; t.classList.add("on");
  setTimeout(function () { t.classList.remove("on"); }, 1800);
}
$("start").onclick = function () { idx = 0; answers = []; render(); show("quiz"); };
$("back").onclick = function () { if (idx > 0) { idx--; render(); } };
$("again").onclick = function () { idx = 0; answers = []; show("intro"); };
$("share").onclick = function () {
  var w = $("rword").textContent;
  var sc = CURRENT ? CURRENT.sc : "";
  var text = sc
    ? KICKER + sc + " 分，是「" + w + "」。" + TITLE
    : KICKER + "「" + w + "」。" + TITLE;
  if (navigator.share) {
    navigator.share({ title: TITLE, text: text }).catch(function () { toast("截图保存这张卡片，直接发出去就行。"); });
  } else {
    toast("截图保存这张卡片，直接发出去就行。");
  }
};
